[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptofutures"
version = "0.1.0"
description = "Crypto futures paper trading driven by local open-weight LLMs, with backtesting and benchmarking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31"]

[project.optional-dependencies]
live = ["ccxt>=4.2"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
cryptofutures = "cryptofutures.cli:main"

[tool.setuptools.packages.find]
include = ["cryptofutures*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
